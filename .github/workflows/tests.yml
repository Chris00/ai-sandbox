name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # test_real_sandbox.py needs bubblewrap ≥ 0.10, which this runner lacks.
    # Run it separately on a host with a sufficiently recent bubblewrap.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        program: [ai, ai.bash]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install what ai needs and the runner lacks
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends inotify-tools python3-seccomp

      - name: Run the tests
        run: tests/run.py
        env:
          AI_TEST_PROGRAM: ${{ matrix.program }}
